[project]
name = "sentinel-investigation"
version = "0.1.0"
description = "From scattered events to defensible investigations."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {file = "LICENSE"}
dependencies = [
  "typer==0.27.3",
  "textual==8.2.8",
  "rich==14.3.4",
  "duckdb==1.5.6",
  "pydantic==2.14.2",
  "mcp==1.30.0",
  "openai==2.54.0",
  "httpx==0.28.1",
  "filelock==3.32.7",
  "tzdata==2026.6",
]
[project.scripts]
sentinel = "sentinel.cli:main"
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]
[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
  "pytest-timeout==2.4.0",
    "ruff==0.17.3",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
timeout_method = "thread"
testpaths = ["tests"]
markers = ["integration: real local MCP subprocess tests"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "pydantic.Field"]
