name: Bug report
description: Report a reproducible product or documentation defect.
title: "bug: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: Describe the difference without including personal data or credentials.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the browser, relevant version, and a minimal safe example.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and impact
      description: Include bounded error codes or redacted evidence. Avoid private transcripts and images.
