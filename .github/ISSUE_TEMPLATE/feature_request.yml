name: Feature request
description: Propose a focused improvement with acceptance criteria.
title: "feature: "
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Who needs this and which concrete problem does it solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected behavior and acceptance criteria
      description: Describe a small complete result and how to verify it.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, dependencies, and costs
      description: Note any provider call, migration, new permission, or external resource needed.
