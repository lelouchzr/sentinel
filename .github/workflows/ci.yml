name: Storyscape checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: make check
      - name: Initialize disposable local database
        run: node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file drizzle/0000_fair_pete_wisdom.sql --yes
      - name: Exercise local API
        shell: bash
        run: |
          node scripts/run-framework.mjs dev --port 5180 --hostname 127.0.0.1 > "$RUNNER_TEMP/storyscape-dev.log" 2>&1 &
          storyscape_pid=$!
          trap 'kill "$storyscape_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:5180/api/health > /dev/null; then break; fi
            sleep 1
          done
          make integration
